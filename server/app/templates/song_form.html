{% extends "base.html" %}
{% block title %}{{ 'Edit ' ~ song.title if song else 'New song' }}{% endblock %}
{% block main_class %}page narrow{% endblock %}
{% block content %}
<h1>{{ 'Edit song' if song else 'New song' }}</h1>
{% if error %}<div class="flash error">{{ error }}</div>{% endif %}
<form method="post" action="{{ '/songs/%d/edit'|format(song.id) if song else '/songs' }}" class="card stack">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Title <input name="title" value="{{ form.title or '' }}" required autofocus></label>
  <label>Artist <input name="artist" value="{{ form.artist or '' }}"></label>
  <div class="row">
    <label>BPM <input name="bpm" inputmode="decimal" value="{{ form.bpm or '' }}" placeholder="e.g. 72"></label>
    <label>Key
      <select name="key">
        {% for k in keys %}<option value="{{ k }}" {{ 'selected' if k == (form.key or '') }}>{{ k or '–' }}</option>{% endfor %}
      </select>
    </label>
    <label>Time signature <input name="time_signature" value="{{ form.time_signature or '4/4' }}"></label>
  </div>
  <label>Notes <textarea name="notes" rows="4" placeholder="Arrangement notes, capo, who sings what…">{{ form.notes or '' }}</textarea></label>
  <div class="row end">
    <a class="button" href="{{ '/songs/%d'|format(song.id) if song else '/' }}">Cancel</a>
    <button class="primary">{{ 'Save' if song else 'Create song' }}</button>
  </div>
</form>
{% endblock %}
