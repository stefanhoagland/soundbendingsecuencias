{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block main_class %}page narrow center{% endblock %}
{% block content %}
<div class="card login">
  <h1 class="brand big">Soundbending <span>Secuencias</span></h1>
  <p class="muted">Your multitrack library</p>
  {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Username <input name="username" value="{{ username or '' }}" autocomplete="username" required autofocus></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <button class="primary">Sign in</button>
  </form>
</div>
{% endblock %}
