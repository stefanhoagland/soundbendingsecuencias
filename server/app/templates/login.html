{% extends "base.html" %}
{% block title %}{{ _('Sign in') }}{% endblock %}
{% block main_class %}page narrow center{% endblock %}
{% block content %}
<div class="card login">
  <img class="logo-big" width="72" height="72" src="{{ url_for('static', path='logo.svg') }}?v={{ static_v }}" alt="">
  <h1 class="brand big">Soundbending <span>Secuencias</span></h1>
  <p class="muted">{{ _('Your multitrack library') }}</p>
  {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>{{ _('Username') }} <input name="username" value="{{ username or '' }}" autocomplete="username" required autofocus></label>
    <label>{{ _('Password') }} <input name="password" type="password" autocomplete="current-password" required></label>
    <button class="primary">{{ _('Sign in') }}</button>
  </form>
</div>
{% endblock %}
